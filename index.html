<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>an・rata｜Stageセルフチェック</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#22362d;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:570px;margin:5vh auto;padding:20px}.panel{background:white;border:1px solid #dee7de;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 12px 40px #12331c10}.eyebrow{text-align:center;color:#6c8c76;font-size:12px;font-weight:750;letter-spacing:.15em}h1{text-align:center;font-size:clamp(22px,5vw,29px);line-height:1.45}p{text-align:center;color:#617368;line-height:1.75;font-size:14px}.top{display:flex;justify-content:space-between;gap:10px;margin:35px 0 10px;font-size:13px}.progress{height:7px;background:#e9eee9;border-radius:9px;overflow:hidden}.bar{height:100%;background:#759c80;transition:width .2s}.question{min-height:190px;display:grid;place-items:center;font-weight:750;font-size:clamp(21px,4.5vw,27px);text-align:center;line-height:1.8;padding:24px 0}button{display:block;width:100%;padding:17px 12px;border-radius:12px;border:1px solid #cadbce;font-size:17px;font-weight:700;cursor:pointer;margin:11px 0;background:#fff;color:#285d3c}button.primary{background:#3d7852;color:white;border-color:#3d7852}.back{border:0;font-size:14px;font-weight:500;color:#68786d;padding:10px}.result{text-align:center}.big{font-size:62px;font-weight:850;color:#376c49;margin:22px 0 0}.note{font-size:13px;color:#647469;line-height:1.8;background:#f4f7f3;border-radius:12px;padding:14px;text-align:left}.hidden{display:none}#next{margin:25px 0}a{color:#396f4b}small{display:block;color:#758579;text-align:center;margin-top:16px}button:focus-visible{outline:3px solid #bbd4c3}</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">an・rata STAGE CHECK</div><h1>今の自分を知る18の質問</h1><p>「できている」「まだできていない」を選ぶだけ。<br>テストではなく、これからの成長を考えるためのチェックです。</p><div id="quiz"><div class="top"><span id="counter"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><button type="button" class="primary" id="yes">✓ できている</button><button type="button" id="no">まだできていない</button><button type="button" class="back" id="back">← 前の質問に戻る</button></div><div id="results" class="result hidden" aria-live="polite"><p>あなたの参考Stage</p><div class="big" id="stage"></div><h2 id="tag"></h2><p id="count"></p><div class="note" id="advice"></div><button id="copy" type="button" class="primary">結果をコピーする</button><button id="reset" type="button">もう一度チェックする</button></div></section><small>入力した回答はこの画面内で計算され、サーバーには送信されません。</small></main><script>const questions=['直近5回の出勤で、出退勤と休憩を毎回記録した','直近10名のお客様に、自分から挨拶した','直近1か月、分からないことを放置せず確認した','直近1か月、担当できる施術を決めた手順で最後まで仕上げた','直近10名の施術前に、希望と料金を確認した','直近3か月の月平均技術売上が30万円以上だった','直近10名のうち8名以上に次回来店の目安を伝えた','直近1か月、自分の次回予約率と再来率を確認した','直近3か月の月平均技術売上が60万円以上だった','直近1か月、得意なメニューを理由に選んでくれたお客様がいた','直近5回の出勤で、予約と休憩予定を事前に確認した','直近3か月の月平均技術売上が80万円以上だった','直近1か月、担当後のお客様の記録を毎回残した','直近1か月、予定変更の前に予約と担当業務を確認した','直近3か月の月平均技術売上が100万円以上だった','今後3か月で挑戦したいことを1つ決めている','直近3か月、頼まれた時に技術や仕事のコツを伝えた','今後やりたい仕事や働き方を会社と具体的に話した'];const names=['基本を覚える','一人で担当する','また来てもらえる仕事','自分の強みを作る','信頼と自己管理を深める','将来の働き方を選ぶ'];let answers=Array(18).fill(null),index=0;const el=id=>document.getElementById(id);function draw(){el('counter').textContent=`質問 ${index+1} / 18`;el('answered').textContent=`${answers.filter(a=>a!==null).length}問回答済み`;el('bar').style.width=(answers.filter(a=>a!==null).length/18*100)+'%';el('question').textContent=questions[index];el('back').disabled=index===0;el('back').style.opacity=index===0?'.3':'1';el('yes').setAttribute('aria-pressed',String(answers[index]===true));el('no').setAttribute('aria-pressed',String(answers[index]===false))}function answer(v){answers[index]=v;if(index===17){show()}else{index++;draw()}}el('yes').onclick=()=>answer(true);el('no').onclick=()=>answer(false);el('back').onclick=()=>{if(index>0){index--;draw()}};function show(){if(answers.some(a=>a===null))return;let passed=0;for(let s=0;s<6;s++){if(answers.slice(s*3,s*3+3).every(Boolean))passed=s+1;else break}let level=Math.max(passed,1);el('quiz').classList.add('hidden');el('results').classList.remove('hidden');el('stage').textContent='Stage '+level;el('tag').textContent=names[level-1];el('count').textContent=`18問中 ${answers.filter(Boolean).length}問が「できている」`;let next=answers.findIndex(a=>a===false);el('advice').textContent=(next>=0?`次に確認すること：${questions[next]}。`:'今できていることを続けていきましょう。')+' これは自己申告による参考結果です。売上の条件や勤務時間・技術などは面談で確認します。Stageや給与の正式決定ではありません。';el('copy').onclick=async()=>{let value=`an・rata Stageチェック：参考Stage${level}\n`+questions.map((q,i)=>`${i+1}. ${q}：${answers[i]?'できている':'まだできていない'}`).join('\n');try{await navigator.clipboard.writeText(value);el('copy').textContent='コピーしました'}catch{window.prompt('結果をコピーしてください',value)}}}el('reset').onclick=()=>{answers=Array(18).fill(null);index=0;el('results').classList.add('hidden');el('quiz').classList.remove('hidden');el('copy').textContent='結果をコピーする';draw()};draw();</script></body></html>
